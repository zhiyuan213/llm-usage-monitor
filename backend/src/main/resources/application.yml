spring:
  application:
    name: metertrail
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/metertrail}
    username: ${DATABASE_USER:metertrail}
    password: ${DATABASE_PASSWORD:local-development-only}
    hikari:
      maximum-pool-size: ${DATABASE_WRITE_POOL_SIZE:8}
      minimum-idle: 1
      connection-timeout: ${DATABASE_WRITE_CONNECTION_TIMEOUT_MS:1000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
spring.lifecycle.timeout-per-shutdown-phase: 30s
management:
  server.port: 9090
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true
  metrics.distribution.percentiles-histogram.http.server.requests: true
metertrail:
  database:
    read-pool-size: ${DATABASE_READ_POOL_SIZE:8}
    read-connection-timeout-ms: ${DATABASE_READ_CONNECTION_TIMEOUT_MS:1000}
  ingest:
    max-inflight: ${INGEST_MAX_INFLIGHT:4}
    pipeline:
      enabled: ${INGEST_PIPELINE_ENABLED:true}
      acceptor-enabled: ${INGEST_ACCEPTOR_ENABLED:true}
      max-inflight: ${INGEST_PIPELINE_MAX_INFLIGHT:2048}
      max-buffered-bytes: ${INGEST_PIPELINE_BUFFER_BYTES:33554432}
      write-batch-requests: ${INGEST_PIPELINE_BATCH_REQUESTS:200}
      group-events: ${INGEST_PIPELINE_GROUP_EVENTS:500}
      flush-bytes: ${INGEST_PIPELINE_FLUSH_BYTES:2097152}
      coalesce-millis: ${INGEST_PIPELINE_COALESCE_MS:20}
      receipt-poll-millis: ${INGEST_PIPELINE_RECEIPT_POLL_MS:20}
      wait-millis: ${INGEST_PIPELINE_WAIT_MS:5000}
      max-queued-requests: ${INGEST_QUEUE_MAX_REQUESTS:20000}
      max-queued-events: ${INGEST_QUEUE_MAX_EVENTS:50000}
      max-queued-bytes: ${INGEST_QUEUE_MAX_BYTES:134217728}
      max-attempts: ${INGEST_QUEUE_MAX_ATTEMPTS:10}
      terminal-retention-seconds: ${INGEST_QUEUE_RECEIPT_SECONDS:600}
  worker:
    group-batches: ${WORKER_GROUP_BATCHES:100}
    group-events: ${WORKER_GROUP_EVENTS:500}
    busy-poll-ms: ${WORKER_BUSY_POLL_MS:10}
    idle-poll-ms: ${WORKER_IDLE_POLL_MS:300}
    slice-ms: ${WORKER_SLICE_MS:250}
    max-batches-per-slice: ${WORKER_MAX_BATCHES_PER_SLICE:1000}
    failure-backoff-ms: ${WORKER_FAILURE_BACKOFF_MS:1000}
  mail:
    provider: ${MAIL_PROVIDER:smtp}
    region: ${TENCENT_SES_REGION:ap-hongkong}
    secret-id: ${TENCENT_SES_SECRET_ID:}
    secret-key: ${TENCENT_SES_SECRET_KEY:}
    verification-template: ${TENCENT_SES_VERIFICATION_TEMPLATE:0}
    notification-template: ${TENCENT_SES_NOTIFICATION_TEMPLATE:0}
    weekly-template: ${TENCENT_SES_WEEKLY_TEMPLATE:0}
    verification-html-template: ${TENCENT_SES_VERIFICATION_HTML_TEMPLATE:0}
    notification-html-template: ${TENCENT_SES_NOTIFICATION_HTML_TEMPLATE:0}
  secret: ${APP_SECRET}
  secure-cookies: ${SECURE_COOKIES:true}
  public-url: ${PUBLIC_URL:http://localhost:8088}
  mail-from: ${MAIL_FROM:noreply@metertrail.local}
  worker-enabled: ${WORKER_ENABLED:true}
  github-client-id: ${GITHUB_CLIENT_ID:}
  github-client-secret: ${GITHUB_CLIENT_SECRET:}
  paddle-client-token: ${PADDLE_CLIENT_TOKEN:}
  paddle-secret: ${PADDLE_WEBHOOK_SECRET:}
  paddle-api-key: ${PADDLE_API_KEY:}
  paddle-core-price: ${PADDLE_CORE_PRICE:}
  paddle-pro-price: ${PADDLE_PRO_PRICE:}
  paddle-url: ${PADDLE_API_URL:https://sandbox-api.paddle.com}
  usage-collection-enabled: ${USAGE_COLLECTION_ENABLED:false}
  creem-api-key: ${CREEM_API_KEY:}
  creem-secret: ${CREEM_WEBHOOK_SECRET:}
  creem-core-product: ${CREEM_CORE_PRODUCT:}
  creem-pro-product: ${CREEM_PRO_PRODUCT:}
  creem-url: ${CREEM_API_URL:https://api.creem.io}
  creem-checkout-enabled: ${CREEM_CHECKOUT_ENABLED:false}
