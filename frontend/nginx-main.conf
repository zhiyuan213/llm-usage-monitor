worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  # Evaluated after try_files resolves extensionless public and SPA routes.
  map $uri $html_cache_control {
    default "";
    ~*\.html$ "no-store";
  }
  # Keep the original request path: SPA fallback rewrites $uri to /index.html.
  map $request_uri $robots_tag {
    default "";
    ~^/(app|api|v1|webhooks|pay|login|register|verify|forgot-password|reset-password)(/|\?|$) "noindex, nofollow, nosnippet";
  }
  include /etc/nginx/conf.d/*.conf;
}
