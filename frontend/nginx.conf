server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  # Static assets only; avoid compressing authenticated API responses containing secrets.
  location /assets/ {
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript image/svg+xml;
    try_files $uri =404;
    expires 1y;
  }
  add_header X-Robots-Tag $robots_tag always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.paddle.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://*.paddle.com https://www.googletagmanager.com https://*.google-analytics.com https://www.google.com; frame-src https://*.paddle.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location ~ ^/(api|v1|webhooks)/ {
    proxy_pass http://metertrail_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }
  location = / { try_files /home.html =404; }
  location / { try_files $uri $uri.html $uri/ /index.html; }
}
