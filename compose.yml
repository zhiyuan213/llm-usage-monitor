name: metertrail
x-app: &app
  image: ${METERTRAIL_IMAGE:-metertrail-api:local}
  build: ./backend
  environment: &app-env
    APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
    DATABASE_URL: jdbc:postgresql://postgres:5432/metertrail
    DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    REDIS_HOST: redis
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_AUTH: ${SMTP_AUTH:-false}
    SMTP_TLS: ${SMTP_TLS:-false}
    MAIL_FROM: ${MAIL_FROM:-noreply@metertrail.local}
    MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
    TENCENT_SES_REGION: ${TENCENT_SES_REGION:-ap-hongkong}
    TENCENT_SES_SECRET_ID: ${TENCENT_SES_SECRET_ID:-}
    TENCENT_SES_SECRET_KEY: ${TENCENT_SES_SECRET_KEY:-}
    TENCENT_SES_VERIFICATION_TEMPLATE: ${TENCENT_SES_VERIFICATION_TEMPLATE:-0}
    TENCENT_SES_NOTIFICATION_TEMPLATE: ${TENCENT_SES_NOTIFICATION_TEMPLATE:-0}
    TENCENT_SES_WEEKLY_TEMPLATE: ${TENCENT_SES_WEEKLY_TEMPLATE:-0}
    TENCENT_SES_VERIFICATION_HTML_TEMPLATE: ${TENCENT_SES_VERIFICATION_HTML_TEMPLATE:-0}
    TENCENT_SES_NOTIFICATION_HTML_TEMPLATE: ${TENCENT_SES_NOTIFICATION_HTML_TEMPLATE:-0}
    SECURE_COOKIES: ${SECURE_COOKIES:-true}
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8088}
    MODEL_PRICE_SYNC_ENABLED: ${MODEL_PRICE_SYNC_ENABLED:-true}
    MODEL_PRICE_CATALOG_URL: ${MODEL_PRICE_CATALOG_URL:-https://models.dev/api.json}
    MODEL_PRICE_SYNC_INTERVAL_MS: ${MODEL_PRICE_SYNC_INTERVAL_MS:-21600000}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    CREEM_MODE: ${CREEM_MODE:-legacy}
    CREEM_TEST_API_KEY: ${CREEM_TEST_API_KEY:-}
    CREEM_TEST_WEBHOOK_SECRET: ${CREEM_TEST_WEBHOOK_SECRET:-}
    CREEM_TEST_CORE_PRODUCT: ${CREEM_TEST_CORE_PRODUCT:-}
    CREEM_TEST_PRO_PRODUCT: ${CREEM_TEST_PRO_PRODUCT:-}
    CREEM_LIVE_API_KEY: ${CREEM_LIVE_API_KEY:-}
    CREEM_LIVE_WEBHOOK_SECRET: ${CREEM_LIVE_WEBHOOK_SECRET:-}
    CREEM_LIVE_CORE_PRODUCT: ${CREEM_LIVE_CORE_PRODUCT:-}
    CREEM_LIVE_PRO_PRODUCT: ${CREEM_LIVE_PRO_PRODUCT:-}
    CREEM_API_KEY: ${CREEM_API_KEY:-}
    CREEM_WEBHOOK_SECRET: ${CREEM_WEBHOOK_SECRET:-}
    CREEM_CORE_PRODUCT: ${CREEM_CORE_PRODUCT:-}
    CREEM_PRO_PRODUCT: ${CREEM_PRO_PRODUCT:-}
    CREEM_API_URL: ${CREEM_API_URL:-https://api.creem.io}
    CREEM_CHECKOUT_ENABLED: ${CREEM_CHECKOUT_ENABLED:-false}
    PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
    PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
    PADDLE_API_KEY: ${PADDLE_API_KEY:-}
    PADDLE_CORE_PRICE: ${PADDLE_CORE_PRICE:-}
    PADDLE_PRO_PRICE: ${PADDLE_PRO_PRICE:-}
    PADDLE_API_URL: ${PADDLE_API_URL:-https://sandbox-api.paddle.com}
    USAGE_COLLECTION_ENABLED: ${USAGE_COLLECTION_ENABLED:-false}
    INGEST_MAX_INFLIGHT: ${INGEST_MAX_INFLIGHT:-4}
    INGEST_REDIS_ENABLED: ${INGEST_REDIS_ENABLED:-true}
    INGEST_REDIS_CONSUMER_ENABLED: 'false'
    DATABASE_WRITE_POOL_SIZE: ${DATABASE_WRITE_POOL_SIZE:-8}
    DATABASE_READ_POOL_SIZE: ${DATABASE_READ_POOL_SIZE:-8}
    DATABASE_WRITE_CONNECTION_TIMEOUT_MS: ${DATABASE_WRITE_CONNECTION_TIMEOUT_MS:-1000}
    DATABASE_READ_CONNECTION_TIMEOUT_MS: ${DATABASE_READ_CONNECTION_TIMEOUT_MS:-1000}
    INGEST_PIPELINE_ENABLED: ${INGEST_PIPELINE_ENABLED:-true}
    INGEST_ACCEPTOR_ENABLED: ${INGEST_ACCEPTOR_ENABLED:-true}
    INGEST_PIPELINE_MAX_INFLIGHT: ${INGEST_PIPELINE_MAX_INFLIGHT:-2048}
    INGEST_PIPELINE_BUFFER_BYTES: ${INGEST_PIPELINE_BUFFER_BYTES:-33554432}
    INGEST_PIPELINE_BATCH_REQUESTS: ${INGEST_PIPELINE_BATCH_REQUESTS:-200}
    INGEST_PIPELINE_GROUP_EVENTS: ${INGEST_PIPELINE_GROUP_EVENTS:-500}
    INGEST_PIPELINE_FLUSH_BYTES: ${INGEST_PIPELINE_FLUSH_BYTES:-2097152}
    INGEST_PIPELINE_COALESCE_MS: ${INGEST_PIPELINE_COALESCE_MS:-20}
    INGEST_PIPELINE_RECEIPT_POLL_MS: ${INGEST_PIPELINE_RECEIPT_POLL_MS:-20}
    INGEST_PIPELINE_WAIT_MS: ${INGEST_PIPELINE_WAIT_MS:-5000}
    INGEST_QUEUE_MAX_REQUESTS: ${INGEST_QUEUE_MAX_REQUESTS:-20000}
    INGEST_QUEUE_MAX_EVENTS: ${INGEST_QUEUE_MAX_EVENTS:-50000}
    INGEST_QUEUE_MAX_BYTES: ${INGEST_QUEUE_MAX_BYTES:-134217728}
    INGEST_QUEUE_MAX_ATTEMPTS: ${INGEST_QUEUE_MAX_ATTEMPTS:-10}
    INGEST_QUEUE_RECEIPT_SECONDS: ${INGEST_QUEUE_RECEIPT_SECONDS:-600}
    WORKER_BUSY_POLL_MS: ${WORKER_BUSY_POLL_MS:-10}
    WORKER_GROUP_BATCHES: ${WORKER_GROUP_BATCHES:-100}
    WORKER_GROUP_EVENTS: ${WORKER_GROUP_EVENTS:-500}
    WORKER_IDLE_POLL_MS: ${WORKER_IDLE_POLL_MS:-300}
    WORKER_SLICE_MS: ${WORKER_SLICE_MS:-250}
    WORKER_MAX_BATCHES_PER_SLICE: ${WORKER_MAX_BATCHES_PER_SLICE:-1000}
    WORKER_FAILURE_BACKOFF_MS: ${WORKER_FAILURE_BACKOFF_MS:-1000}
    WORKER_ENABLED: 'false'
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped
  stop_grace_period: 45s
  mem_limit: 768m
  cpus: 1.5
  healthcheck:
    test: [CMD, wget, -q, --spider, http://localhost:9090/actuator/health/readiness]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 45s
services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - shared_buffers=256MB
    environment:
      POSTGRES_DB: metertrail
      POSTGRES_USER: metertrail
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U metertrail]
      interval: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 1g
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, always, --maxmemory, 384mb, --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped
  api-blue: *app
  api-green:
    <<: *app
    profiles: [release]
  worker:
    <<: *app
    environment:
      <<: *app-env
      WORKER_ENABLED: 'true'
      INGEST_REDIS_CONSUMER_ENABLED: 'true'
      INGEST_PIPELINE_ENABLED: 'false'
      INGEST_ACCEPTOR_ENABLED: 'false'
  web:
    build: ./frontend
    ports: ["127.0.0.1:8088:8080"]
    volumes:
      - ./ops/nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
      - ./.local/web-assets:/usr/share/nginx/html/retained-assets:ro
    depends_on:
      api-blue: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 128m
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
    mem_limit: 128m
volumes:
  redis-data:
  postgres-data:
